<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - DIONOVEDADES</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>

    <header>
        <h1>DIONOVEDADESSS</h1>
        <p>Panel de Administración</p>
    </header>

    <hr>

    <main>
        <section id="login">
            <h2>Iniciar Sesión</h2>
            
            <form id="form-login">
                <div>
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
                </div>

                <br>

                <div>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <br>

                <button type="submit">Ingresar al Panel</button>
            </form>

            <br>
            <!-- Mensaje de error dinámico controlado por JavaScript -->
            <p id="mensaje-error" style="color: red;"></p>
        </section>
    </main>

    <hr>

    <footer>
        <p><a href="index.html">← Volver al catálogo público</a></p>
    </footer>

    <script>
        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const u = document.getElementById('usuario').value;
            const p = document.getElementById('password').value;

            // --- CREDENCIALES GENÉRICAS ---
            // Puedes cambiar 'admin' y '1234' por lo que tú quieras en cualquier momento
            const usuarioValido = 'Dionirys';
            const claveValida = 'Better45.';

            if (u === usuarioValido && p === claveValida) {
                window.location.href = 'admin.html';
            } else {
                document.getElementById('mensaje-error').textContent = 'Usuario o contraseña incorrectos.';
            }
        });
    </script>
</body>
</html>
